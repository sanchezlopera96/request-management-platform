name: request-desk

services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-inMemory']
    ports:
      - '${DYNAMODB_PORT:-8010}:8000'

  init:
    build: &api-build
      context: ./api
      secrets: [extra_ca]
    image: request-desk-api:local
    command: ['node', 'dist/scripts/seed.js']
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      TABLE_NAME: service-requests
    depends_on:
      - dynamodb
    restart: 'no'
    healthcheck:
      disable: true

  api:
    build: *api-build
    image: request-desk-api:local
    environment:
      PORT: 3000
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      TABLE_NAME: service-requests
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - '${API_PORT:-3000}:3000'

  web:
    build:
      context: ./web
      secrets: [extra_ca]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-4200}:8080'

secrets:
  extra_ca:
    file: ${EXTRA_CA_CERT:-./certs/none.pem}
